<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>时光暗号 · 代码查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e8edf5 0%, #dce3ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.05);
            padding: 36px 28px 44px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 650;
            background: linear-gradient(135deg, #1e3a4d, #2c6280);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .sub {
            color: #5e7b9c;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
            margin-bottom: 32px;
            font-weight: 480;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 520;
            color: #1f4768;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border: 1.5px solid #dee7f0;
            border-radius: 60px;
            background: white;
            font-weight: 500;
            transition: 0.2s;
            outline: none;
            color: #0a2a3b;
        }

        input:focus {
            border-color: #2c7cb6;
            box-shadow: 0 0 0 3px rgba(44, 124, 182, 0.2);
        }

        button {
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(105deg, #2c6280, #1e4a64);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(28, 74, 102, 0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        .result-card {
            margin-top: 28px;
            background: #f0f6fe;
            border-radius: 32px;
            padding: 20px 18px;
            border: 1px solid #cde2f5;
            transition: 0.2s;
        }

        .result-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4a7c9c;
            margin-bottom: 8px;
        }

        .result-content {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 1.1rem;
            font-weight: 550;
            color: #1f4e6e;
            word-break: break-word;
            line-height: 1.4;
        }

        .footer-note {
            margin-top: 28px;
            font-size: 0.7rem;
            text-align: center;
            color: #85a2bd;
            border-top: 1px solid #e5edf5;
            padding-top: 20px;
        }

        .badge {
            display: inline-block;
            background: #eef2f8;
            border-radius: 32px;
            padding: 4px 10px;
            font-size: 0.7rem;
            margin-right: 6px;
            margin-top: 6px;
            color: #2c6280;
        }

        .info-icon {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #6f95b5;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>⏳ 时光暗号</h1>
        <div class="sub">输入代码 · 解锁预定时刻</div>

        <div class="input-group">
            <label>📌 代码 / 暗号</label>
            <input type="text" id="codeInput" placeholder="例如: abcde" autocomplete="off" autofocus>
        </div>

        <button id="queryBtn">✨ 查询时间</button>

        <div class="result-card" id="resultCard">
            <div class="result-label">🔓 查询结果</div>
            <div class="result-content" id="resultText">输入代码后显示对应信息</div>
        </div>

        <div class="info-icon">
            ⚡ 每个代码对应唯一的预设时刻
        </div>
        <div class="footer-note">
            📱 扫码即用 · 数据永久保存
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 🔐 在这里修改你的代码与对应信息（核心数据）
    // ============================================================
    const CODE_MAP = {
        "abcde": "2026年05月20日 23:02",
        "hello": "2025年12月25日 10:30",
        "love2026": "2026年06月01日 00:00",
        "secret": "2049年10月01日 12:00",
        "mof2026": "2026年07月15日 14:30"
        // 👆 继续添加任意多组: "代码": "对应信息"
    };
    // ============================================================

    // 获取DOM元素
    const inputEl = document.getElementById('codeInput');
    const btnEl = document.getElementById('queryBtn');
    const resultTextEl = document.getElementById('resultText');

    // 查询函数
    function performQuery() {
        const code = inputEl.value.trim();
        if (code === "") {
            resultTextEl.innerHTML = "⚠️ 请输入代码";
            return;
        }

        const message = CODE_MAP[code];
        if (message) {
            resultTextEl.innerHTML = `🔑 代码「${escapeHtml(code)}」<br>⏰ 对应信息：${escapeHtml(message)}`;
        } else {
            resultTextEl.innerHTML = `❌ 未找到代码「${escapeHtml(code)}」<br><span style="font-size:0.8rem; opacity:0.7;">请确认代码是否正确</span>`;
        }
    }

    // 防止XSS
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 绑定事件
    btnEl.addEventListener('click', performQuery);
    inputEl.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') performQuery();
    });
</script>
</body>
</html>
